org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
// Disable Kotlin daemon and incremental compilation to avoid cross-drive path issues on Windows
kotlin.daemon.jvm.options=-Dkotlin.daemon.enabled=false
kotlin.incremental=false

// Suppress the unsupported compileSdk warning for 35 (AGP will warn; upgrade AGP when possible)
android.suppressUnsupportedCompileSdk=35
