pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
    google()
    // Primary Maven Central entry (may resolve to repo.maven.apache.org)
    mavenCentral()
    // Explicit mirror/fallback in case repo.maven.apache.org DNS fails
    maven { url 'https://repo1.maven.org/maven2' }
    // Optional public mirror for regions with restricted access (can be removed)
    maven { url 'https://maven.aliyun.com/repository/public' }
    gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.2.1" apply false
    // Match the Kotlin version used by the buildscript to avoid mixed-version resolution
    id "org.jetbrains.kotlin.android" version "1.9.22" apply false
}

include ":app"
